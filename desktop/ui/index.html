<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI抓包工具</title>
    <style>
      :root {
        color: #151923;
        background: #f7f8fb;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #e4e7ee;
        border-radius: 28px;
        box-shadow: 0 24px 80px rgba(19, 26, 44, 0.12);
        max-width: 620px;
        padding: 42px;
        width: calc(100% - 48px);
      }

      .eyebrow {
        color: #718096;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        font-size: 34px;
        margin: 14px 0 12px;
      }

      p {
        color: #687385;
        font-size: 17px;
        line-height: 1.7;
        margin: 0;
      }

      .status {
        align-items: center;
        background: #edf6ff;
        border-radius: 18px;
        color: #0b63ce;
        display: flex;
        font-weight: 800;
        gap: 12px;
        margin-top: 28px;
        padding: 16px 18px;
      }

      .dot {
        animation: pulse 1.2s ease-in-out infinite;
        background: #0b7cff;
        border-radius: 999px;
        height: 10px;
        width: 10px;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.75); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Desktop Bootstrap</div>
      <h1>正在启动 AI抓包工具</h1>
      <p>桌面端正在启动本机抓包服务。服务就绪后会自动进入控制台。</p>
      <div class="status">
        <span class="dot"></span>
        <span id="statusText">启动 FastAPI 后端中</span>
      </div>
    </main>
    <script>
      window.__showDesktopError = function showDesktopError(message) {
        document.getElementById("statusText").textContent = message || "启动失败，请查看桌面端日志。";
      };
    </script>
  </body>
</html>
