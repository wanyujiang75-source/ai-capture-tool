plugins { id 'com.android.application' }
android {
    namespace 'com.local.capture.bridge'
    compileSdk 35
    defaultConfig { applicationId 'com.local.capture.bridge'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
}
dependencies {
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
